# Synaptic Loom on one host: Docker Compose + Caddy (D17, DESIGN.md §6.2).
#
#   internet ──80/443──▶ caddy ──backend (internal)──▶ loom:8080 ──▶ volume loom_data:/data
#
# Caddy is the ONLY published service. It terminates TLS for LOOM_DOMAIN with automatic
# HTTPS and forwards to the server over `backend`, a network with no route to the outside
# and no published port, so the server can only be reached through Caddy and every
# request it sees comes from one known address.
#
# The client address (it keys the auth-failure and health limiters and the audit line) is
# `peer`: the TCP peer, as uvicorn leaves it. uvicorn's proxy-headers handling is on by
# default and rewrites the peer from X-Forwarded-For ONLY when the connection comes from
# an address in FORWARDED_ALLOW_IPS, which is Caddy's fixed address below and nothing
# else. Caddy itself discards a client's own X-Forwarded-For (it trusts no upstream proxy
# unless `trusted_proxies` says so) and sends the address it accepted the connection from.
# NEVER set FORWARDED_ALLOW_IPS to `*`: any client could then name its own address, buy a
# fresh rate-limit bucket per request and write what it likes into the audit log.
#
# The literals that must agree are the backend subnet (and its ip_range), Caddy's
# ipv4_address and FORWARDED_ALLOW_IPS. If 10.217.17.0/24 collides with a network on your
# host, change them together.
#
# Usage (docs/SERVER-GUIDE.md, Part 2): cp .env.example .env; edit; docker compose up -d
#
# Backups (D18): the `backup` service writes a verified copy of the database every
# LOOM_BACKUP_INTERVAL into its own volume, `loom_backups`; another machine pulls them off
# the host. restore.sh restores one into a NEW volume. SERVER-GUIDE Part 2 §8.

name: loom

services:
  loom:
    build: &server-build
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOOM_DB: /data/loom.db
      LOOM_CLIENT_IP_SOURCE: peer
      FORWARDED_ALLOW_IPS: 10.217.17.2
    volumes:
      - loom_data:/data
    networks:
      - backend
    # Docker SIGKILLs this long after SIGTERM. It must stay STRICTLY above the Dockerfile
    # CMD's `--timeout-graceful-shutdown 25`, for the same reason as fly.toml's kill_timeout.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  # Same image as the server, run as `app` (the database's owner: a sidecar file SQLite
  # creates as anyone else is one the server cannot write), with no network at all and
  # nothing published. One backup when it starts, then one every LOOM_BACKUP_INTERVAL;
  # SIGTERM ends it with exit 0. A failed backup ends it non-zero, so `restart` retries
  # it and `docker compose ps` shows it restarting. /data is mounted read-write because
  # reading a WAL database means taking locks in its -shm file; backup.sh opens the
  # database read-only.
  backup:
    build: *server-build
    restart: unless-stopped
    user: app
    network_mode: none
    depends_on:
      loom:
        condition: service_healthy
    command: ["/app/server/backup.sh", "--every", "${LOOM_BACKUP_INTERVAL:-6h}"]
    environment:
      LOOM_DB: /data/loom.db
      LOOM_BACKUP_DIR: /backups
      LOOM_BACKUP_KEEP: ${LOOM_BACKUP_KEEP:-14}
      LOOM_SERVER_PY: /app/.venv/bin/python
    volumes:
      - loom_data:/data
      - loom_backups:/backups
    # A backup in progress is finished before the loop exits; this bounds how long.
    stop_grace_period: 30s

  caddy:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    depends_on:
      loom:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LOOM_DOMAIN: ${LOOM_DOMAIN:?set LOOM_DOMAIN in .env (see .env.example)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {}
      backend:
        ipv4_address: 10.217.17.2

networks:
  # Where the published ports land, and Caddy's way out to the ACME CA. IPv4 only: an IPv6
  # client would reach Caddy through Docker's userland proxy as the gateway's address, so
  # publish no AAAA record (docs/SERVER-GUIDE.md Part 2 §2).
  edge: {}
  backend:
    internal: true
    ipam:
      config:
        - subnet: 10.217.17.0/24
          # Dynamic addresses come from the upper half only, so the fixed one below it
          # (Caddy's) can never have been handed to another container first.
          ip_range: 10.217.17.128/25

volumes:
  # The database. Its Docker name is `<project>_loom_data` (loom_loom_data) until
  # restore.sh puts the server on a restored volume and records that volume's name as
  # LOOM_DATA_VOLUME in .env. The volume it replaced is left as it was.
  loom_data:
    name: ${LOOM_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_loom_data}
  # The backups (loom_loom_backups). Same host and disk as the database: only the off-host
  # copy survives losing the host. `docker compose down -v` deletes it with the rest.
  loom_backups: {}
  # Caddy's certificates and ACME account: losing them means re-issuing, not data loss.
  caddy_data: {}
  caddy_config: {}
