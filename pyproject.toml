[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.1.0"
description = "Synaptic Loom - knowledge base of Claude Code sessions for cross-reviews."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
server = ["fastapi", "uvicorn", "jinja2", "markdown-it-py"]
client = ["requests"]
dev = ["pytest", "pytest-httpserver", "httpx"]

[project.scripts]
loom = "loom.cli:main"

# Monorepo with a single installable package: `loom` (client, in client/loom) and `server`
# (server, in server/). See PLAN.md §T1 / DESIGN.md §10.
[tool.setuptools]
packages = ["loom", "server"]

[tool.setuptools.package-dir]
loom = "client/loom"
server = "server"

[tool.pytest.ini_options]
testpaths = ["server/tests", "client/tests"]
# Registered so `-m e2e` / `-m "not e2e"` select reliably and an unregistered-mark warning
# (which `-W error` turns into a collection ERROR) can never hide the end-to-end suites.
markers = [
  "e2e: end-to-end suite — real server, real CLI subprocesses, real install.sh (slow).",
]
